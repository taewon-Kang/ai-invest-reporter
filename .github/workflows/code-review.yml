name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Make diff
        id: diff
        run: |
          git diff -U0 ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > patch.diff || true
          if [ ! -s patch.diff ]; then echo "no diff" > patch.diff; fi

      - name: Generate review
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > review_script.js << 'EOF'
          const fs = require('fs');
          const https = require('https');

          function readPatch(path) {
            try {
              const txt = fs.readFileSync(path, 'utf8');
              const max = 120000;
              if (txt.length <= max) return txt;
              const head = Math.floor(max * 0.7);
              const tail = max - head;
              return txt.slice(0, head) + "\n... (truncated) ...\n" + txt.slice(-tail);
            } catch {
              return '';
            }
          }

          function callOpenAI(prompt) {
            const data = JSON.stringify({
              model: "gpt-5",
              messages: [
                { role: "system", content: "당신은 시니어 코드 리뷰어입니다. 변경된 라인 중심으로 정확한 근거와 구체적 수정안을 한국어로 제시하세요. 필요 시 코드 제안을 포함하세요." },
                { role: "user", content: prompt }
              ],
              max_completion_tokens: 1500
            });
            const options = {
              hostname: 'api.openai.com',
              port: 443,
              path: '/v1/chat/completions',
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`
              }
            };
            return new Promise((resolve) => {
              const req = https.request(options, (res) => {
                let buf = '';
                res.on('data', (c) => buf += c);
                res.on('end', () => {
                  try {
                    const j = JSON.parse(buf);
                    if (j.error) return resolve(`API 요청 실패: ${JSON.stringify(j.error)}`);
                    const out = j.choices?.[0]?.message?.content?.trim() || '리뷰 결과가 비어 있습니다.';
                    resolve(out);
                  } catch (e) {
                    resolve(`응답 파싱 오류: ${e.message}`);
                  }
                });
              });
              req.on('error', (e) => resolve(`API 요청 오류: ${e.message}`));
              req.write(data);
              req.end();
            });
          }

          (async () => {
            const diff = readPatch('patch.diff');
            const prompt = [
              "아래는 이 PR의 unified diff(-U0)입니다.",
              "",
              "리뷰 출력 형식:",
              "1) 주요 이슈",
              "2) 잠재적 버그/경계값",
              "3) 보안/성능",
              "4) 스타일/일관성",
              "5) 테스트 보강 포인트",
              "가능하면 코드 제안을 함께 제시하세요.",
              "",
              "diff:",
              diff
            ].join("\n");
            const review = await callOpenAI(prompt);
            fs.writeFileSync('review.txt', review, 'utf8');
            console.log('REVIEW_RESULT<<EOF');
            console.log(review);
            console.log('EOF');
          })();
          EOF

          node review_script.js | tee review_out.txt
          awk '/REVIEW_RESULT<<EOF/{flag=1;next}/EOF/{flag=0}flag' review_out.txt > review.txt
          echo "review<<EOF" >> $GITHUB_OUTPUT
          cat review.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              "## 🤖 AI 코드 리뷰",
              "",
              `${{ steps.review.outputs.review }}` || "리뷰 결과를 가져오지 못했습니다.",
              "",
              "---",
              "_이 리뷰는 GitHub Actions와 GPT-5로 자동 생성되었습니다._"
            ].join("\n");
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
