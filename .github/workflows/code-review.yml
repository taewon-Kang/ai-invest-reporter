name: AI Code Review (Debug)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-review-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Make diff
        id: diff
        run: |
          set -euo pipefail
          git diff -U0 ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > patch.diff || true
          if [ ! -s patch.diff ]; then
            echo "no diff" > patch.diff
          fi
          echo "== DIFF SIZE ==" && wc -c patch.diff || true
          echo "== DIFF HEAD ==" && head -n 40 patch.diff || true

      - name: Minify diff (keep only changed lines and hunk headers)
        run: |
          set -euo pipefail
          # 파일 경계, hunk header, 실제 +/- 변경 행만 남김
          awk '
            /^diff --git / {print; next}
            /^@@/         {print; next}
            /^\+/ && $0 !~ /^\+\+\+/ {print; next}
            /^-/ && $0 !~ /^---/     {print; next}
          ' patch.diff > patch.min.diff

          # 안전 캡(2MB)
          MAX_BYTES=$((1024*1024*2))
          ACTUAL=$(wc -c < patch.min.diff || echo 0)
          if [ "$ACTUAL" -gt "$MAX_BYTES" ]; then
            head -c "$MAX_BYTES" patch.min.diff > patch.min.diff.trim
            mv patch.min.diff.trim patch.min.diff
            echo "[trim] patch.min.diff truncated to $MAX_BYTES bytes"
          fi

          echo "== MINIFIED DIFF SIZE ==" && wc -c patch.min.diff || true
          echo "== MINIFIED DIFF HEAD ==" && head -n 40 patch.min.diff || true

      - name: Generate review (debug with strong chunking)
        id: review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "review<<EOF" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY가 비어 있습니다. 포크 PR이거나 Secrets 미설정입니다." >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat > review_script.js << 'EOF'
          const fs = require('fs');
          const https = require('https');

          // 🔧 강한 가드: 입력/출력 모두 짧게
          const CHUNK_CHAR_BUDGET = 1200;     // ≈ 300 토큰 내외
          const MAX_COMPLETION_TOKENS = 256;  // 먼저 짧게 강제
          const MAX_CHUNKS = 60;              // 호출 개수 상한

          function readWhole(path) {
            try { return fs.readFileSync(path, 'utf8'); } catch { return ''; }
          }

          function splitByFile(diffText) {
            const files = [];
            const lines = diffText.split('\n');
            let cur = [];
            for (const line of lines) {
              if (line.startsWith('diff --git ')) {
                if (cur.length) files.push(cur.join('\n'));
                cur = [line];
              } else {
                cur.push(line);
              }
            }
            if (cur.length) files.push(cur.join('\n'));
            return files;
          }

          function chunkByChars(text, budget = CHUNK_CHAR_BUDGET) {
            const chunks = [];
            for (let i = 0; i < text.length; i += budget) {
              chunks.push(text.slice(i, i + budget));
            }
            return chunks;
          }

          function buildPrompt(diffChunk) {
            return [
              "아래는 이 PR의 변경 라인 일부(diff -U0 최소화)입니다.",
              "중요 이슈만 불릿으로 간결하게 작성하세요.",
              "- 섹션: 1) 버그/경계 2) 보안/성능 3) 스타일 4) 테스트",
              "- 각 섹션 최대 2개 불릿, 전체 최대 8문장/700자.",
              "- 가능하면 코드 제안 1~2개.",
              "출력은 불릿만, 서론/결론 금지. 마지막에 <END>로 종료.",
              "",
              "diff:",
              diffChunk,
              "",
              "<END>"
            ].join("\n");
          }

          function callOpenAI(prompt) {
            const payloadObj = {
              model: "gpt-5",
              messages: [
                { role: "system", content: "시니어 코드 리뷰어. 간결·구체. 사족 금지. 결과만." },
                { role: "user", content: prompt }
              ],
              max_completion_tokens: MAX_COMPLETION_TOKENS,
              reasoning: { effort: "low" },   // 내부 추론 토큰 억제 시도
              stop: ["<END>"]
            };
            const payload = JSON.stringify(payloadObj);
            console.log("=== OpenAI payload ===\n", payload); // 전송 파라미터 로깅

            const options = {
              hostname: "api.openai.com",
              port: 443,
              path: "/v1/chat/completions",
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${process.env.OPENAI_API_KEY}`
              }
            };

            return new Promise((resolve) => {
              const req = https.request(options, (res) => {
                let buf = "";
                res.on("data", (c) => (buf += c));
                res.on("end", () => {
                  try { fs.writeFileSync("openai_status.txt", String(res.statusCode)); } catch {}
                  try { fs.writeFileSync("openai_headers.json", JSON.stringify(res.headers, null, 2)); } catch {}
                  try { fs.writeFileSync("openai_response_raw.json", buf); } catch {}

                  try {
                    const j = JSON.parse(buf);
                    console.log("=== OPENAI RAW RESPONSE ===\n", JSON.stringify(j, null, 2));
                    if (j.error) return resolve({ ok:false, msg:`API 요청 실패: ${JSON.stringify(j.error)}` });
                    const choice = j.choices?.[0];
                    const content = (choice?.message?.content || "").trim();
                    if (!content) return resolve({ ok:false, msg:`빈 choices. finish_reason=${choice?.finish_reason || 'n/a'}` });
                    resolve({ ok:true, msg: content });
                  } catch (e) {
                    console.log("응답 원문(앞부분):", buf.slice(0, 500));
                    resolve({ ok:false, msg:`응답 파싱 오류: ${e.message}` });
                  }
                });
              });
              req.on("error", (e) => resolve({ ok:false, msg:`API 요청 오류: ${e.message}` }));
              req.write(payload);
              req.end();
            });
          }

          async function reviewChunk(diffChunk) {
            let r = await callOpenAI(buildPrompt(diffChunk));
            if (r.ok) return r.msg;

            // 길이 의심 시 더 잘게 나눠 재시도
            if (diffChunk.length > CHUNK_CHAR_BUDGET / 2) {
              const mid = Math.floor(diffChunk.length / 2);
              const left = diffChunk.slice(0, mid);
              const right = diffChunk.slice(mid);
              const a = await reviewChunk(left);
              const b = await reviewChunk(right);
              return [a, b].filter(Boolean).join("\n\n");
            }
            return `부분 리뷰 실패: ${r.msg}`;
          }

          (async () => {
            const diff = readWhole("patch.min.diff");
            if (!diff.trim() || diff.trim() === "no diff") {
              const msg = "patch.min.diff 가 비어 있습니다. 변경 라인이 없거나 최소화 과정에서 비었습니다.";
              fs.writeFileSync("review.txt", msg, "utf8");
              console.log("REVIEW_RESULT<<EOF"); console.log(msg); console.log("EOF");
              process.exit(0);
            }

            const fileDiffs = splitByFile(diff);
            const outputs = [];
            let processed = 0;
            for (const fd of fileDiffs) {
              if (processed >= MAX_CHUNKS) { outputs.push(`(나머지 일부 파일은 스킵됨)`); break; }
              const fileChunks = chunkByChars(fd, CHUNK_CHAR_BUDGET);
              for (const ch of fileChunks) {
                if (processed >= MAX_CHUNKS) break;
                const out = await reviewChunk(ch);
                if (out) outputs.push(out);
                processed++;
              }
            }

            const merged = outputs.join("\n\n---\n\n").slice(0, 20000); // 최종 안전 캡
            fs.writeFileSync("review.txt", merged || "리뷰 결과가 비어 있습니다.", "utf8");
            console.log("REVIEW_RESULT<<EOF"); 
            console.log(merged || "리뷰 결과가 비어 있습니다."); 
            console.log("EOF");
          })();
          EOF

          node review_script.js | tee review_out.txt
          awk '/REVIEW_RESULT<<EOF/{flag=1;next}/EOF/{flag=0}flag' review_out.txt > review.txt || true

          if [ ! -s review.txt ]; then
            echo "[warn] review.txt is empty"
            echo "review<<EOF" >> "$GITHUB_OUTPUT"
            echo "리뷰 결과 파일이 비었습니다. openai_response_raw.json / openai_status.txt / openai_headers.json 를 확인하세요." >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "review<<EOF" >> "$GITHUB_OUTPUT"
            cat review.txt >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-debug
          path: |
            patch.diff
            patch.min.diff
            review_out.txt
            review.txt
            openai_status.txt
            openai_headers.json
            openai_response_raw.json

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const review = `${{ steps.review.outputs.review }}` || '리뷰 결과를 가져오지 못했습니다.';
            const body = [
              "## 🤖 AI 코드 리뷰 (Debug)",
              "",
              review,
              "",
              "---",
              "_이 리뷰는 GitHub Actions와 GPT-5로 자동 생성되었습니다._"
            ].join("\n");
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
